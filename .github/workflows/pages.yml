name: Publish Sternenhafen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install build tools
        run: npm ci

      - name: Test game simulation
        run: npm test

      - name: Build website
        run: npm run build

      - name: Build single-file edition
        run: npm run build:standalone

      - name: Include downloadable edition
        run: |
          mkdir -p dist/downloads
          cp release/Sternenhafen.html dist/downloads/Sternenhafen.html
          zip -j dist/downloads/Sternenhafen-HTML.zip release/Sternenhafen.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  publish:
    name: Publish website
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
